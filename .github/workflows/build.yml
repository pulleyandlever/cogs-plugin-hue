name: Build and publish

on:
  push:
    branches: [main]
    tags:
      - v*.*.*
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
          cache: "yarn"
      - run: yarn
      - name: Unit tests
        run: yarn test --watchAll=false
        env:
          CI: "true"
      - name: Reliability regression suite
        run: yarn test:reliability
      - name: Soak test (60s)
        run: yarn test:soak
        env:
          SOAK_SECONDS: "60"
      - run: yarn build
      - working-directory: build
        run: zip -r dog.clockwork.hue.zip dog.clockwork.hue
      - uses: actions/upload-artifact@v4
        with:
          name: dog.clockwork.hue.zip
          path: build/dog.clockwork.hue.zip
      - uses: ncipollo/release-action@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          allowUpdates: true
          artifacts: build/dog.clockwork.hue.zip
          token: ${{ secrets.GITHUB_TOKEN }}
